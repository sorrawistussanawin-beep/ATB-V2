                ihd: '150 mg PO q 24h', capd: '150 mg PO q 24h', crrt: '150 mg PO q 24h'
            }
        ];

        // --- SMART WEIGHT-BASED DOSE CALCULATION ENGINE ---
        const parseAndCalculateDose = (doseStr, weight, drugId) => {
            if (!weight || !doseStr) return { dose: doseStr, note: null, original: doseStr };
            const w = parseFloat(weight);
            if (isNaN(w) || w <= 0) return { dose: doseStr, note: null, original: doseStr };

            // 1. Standard Weight-Based Drugs 
            const regex = /(\d+(?:\.\d+)?)(?:-(\d+(?:\.\d+)?))?\s*mg\/kg(?:\/day)?/gi;
            let newDoseStr = doseStr;

            newDoseStr = doseStr.replace(regex, (matchFull, p1, p2) => {
                const min = parseFloat(p1);
                const max = p2 ? parseFloat(p2) : null;
                
                const roundDose = (val) => {
                    if (val <= 5) return Math.round(val * 10) / 10;
                    if (val <= 20) return Math.round(val);
                    if (val <= 50) return Math.round(val / 5) * 5;
                    if (val <= 250) return Math.round(val / 10) * 10;
                    return Math.round(val / 50) * 50; 
                };
                
                let totalMin = roundDose(min * w);
                let totalMax = max ? roundDose(max * w) : null;
                
                // Extract Max Limit within string
                const maxRegex = /Max\s*(\d+(?:\.\d+)?)\s*(mg|g)/i;
                const maxMatch = doseStr.match(maxRegex); 
                let maxLimit = null;
                if (maxMatch) {
                    maxLimit = parseFloat(maxMatch[1]);
                    if (maxMatch[2].toLowerCase() === 'g') maxLimit *= 1000;
                }
                
                if (maxLimit) {
                    totalMin = Math.min(totalMin, maxLimit);
                    if (totalMax) totalMax = Math.min(totalMax, maxLimit);
                }
                
                let isPerDay = matchFull.toLowerCase().includes('mg/kg/day');
                let calcStr = max 
                    ? `${totalMin}-${totalMax} mg${isPerDay ? '/day' : ''}` 
                    : `${totalMin} mg${isPerDay ? '/day' : ''}`;
                
                if (doseStr.toLowerCase().includes('(tmp)') && !calcStr.toLowerCase().includes('(tmp)')) {
                    calcStr += ' (TMP)';
                }
                
                return calcStr;
            });

            return { dose: newDoseStr, note: null, original: doseStr };
        };

        function App() {
            const [formData, setFormData] = useState({ weight: '', scr: '', age: '', gender: 'male' });
            const [dialysisType, setDialysisType] = useState('none');

                if (dialysisType !== 'none') return null;
                const { weight, scr, age, gender } = formData;
                if (!weight || !scr || !age) return null;
                let val = ((140 - parseFloat(age)) * parseFloat(weight)) / (72 * parseFloat(scr));
                if (gender === 'female') val *= 0.85;
                return Math.round(val);
            }, [formData, dialysisType]);

            const filteredDrugs = useMemo(() => {
                if (!searchTerm) return [];
                return DRUG_DATABASE.filter(drug => 
                    drug.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    drug.class.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [searchTerm]);

            const currentRecommendation = useMemo(() => {
                if (!selectedDrug) return null;
                if (dialysisType === 'hd') return { dose: selectedDrug.ihd || 'No specific data', label: 'Hemodialysis (IHD)', type: 'hd' };
                if (dialysisType === 'capd') return { dose: selectedDrug.capd || 'See Ref', note: 'Consult specific guidelines', refDose: 'N/A', type: 'capd' };
                if (crcl === null) return null;
                
                const match = selectedDrug.adjustments.find(adj => {
                    if (adj.max !== undefined) return crcl >= adj.min && crcl <= adj.max;
                    return crcl >= adj.min;
                });
                return match ? { ...match, type: 'crcl' } : { dose: "See standard dose", label: "Normal Range", type: 'crcl' };
            }, [selectedDrug, crcl, dialysisType]);

            // Smart Calc on the current recommendation
            const calculatedData = useMemo(() => {
                if (!selectedDrug || !currentRecommendation) return null;
                return parseAndCalculateDose(currentRecommendation.dose, formData.weight, selectedDrug.id);
            }, [selectedDrug, currentRecommendation, formData.weight]);

            // Smart Calc on Loading Dose
            const calculatedLD = useMemo(() => {
                if (!selectedDrug || !selectedDrug.loadingDose) return null;
                if (selectedDrug.loadingDose.includes('Require full dose in 24 hr')) return { dose: 'Require full dose in 24 hr', original: 'Require full dose in 24 hr' };
                return parseAndCalculateDose(selectedDrug.loadingDose, formData.weight, selectedDrug.id);
            }, [selectedDrug, formData.weight]);

            const getPregnancyColor = (cat) => {
                if (cat === 'A' || cat === 'B') return 'bg-teal-100 text-teal-900 border-teal-300';
                if (cat === 'C') return 'bg-amber-100 text-amber-900 border-amber-300';
                return 'bg-rose-100 text-rose-900 border-rose-300';

            // Final Display Variables
            const displayMainDose = calculatedData?.dose || currentRecommendation?.dose || "...";

                                                    </div>
                                                )}
                                                {calculatedLD.note && !calculatedLD.original.includes('Require full dose') && (
                                                    <div className="text-xs font-black text-orange-900 mt-3 bg-orange-200/80 inline-block px-3 py-2 rounded-lg border border-orange-300">
                                                        {calculatedLD.note}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="bg-gradient-to-br from-pink-50 to-blue-50 rounded-3xl p-8 border border-pink-300 text-center relative shadow-inner">
                                            <div className="text-xs font-black text-pink-700 uppercase mb-4 tracking-[0.2em]">
                                                {isCalculated ? 'Calculated Maintenance (ยาสุทธิ)' : 'Adjusted Maintenance'}
                                            </div>
                                            
                                            {/* Final Calculated Dose Displayed Prominently */}
                                            <div className="text-4xl font-black text-slate-900 tracking-tight leading-tight mb-2">
                                                {displayMainDose}
                                            </div>

                                            {isCalculated && (
                                                <div className="text-lg font-bold text-slate-500 mb-4">
                                                    ({calculatedData.original})
                                                </div>
                                            )}
                                            
                                            {displaySubNote && (
                                                <div className="mt-2 text-base font-black text-orange-900 bg-white px-5 py-2.5 rounded-xl shadow-md border-2 border-orange-400 inline-flex items-center gap-2 animate-pop-in">
                                                    {displaySubNote}
                                                </div>
                                            )}

                                            {!displaySubNote && currentRecommendation?.label && (
                                                <div className="text-sm font-black text-pink-800 bg-white px-5 py-2 rounded-full border border-pink-400 inline-block shadow-sm mt-2">
                                                    Condition: {currentRecommendation.label}
                                                </div>
                                            )}

                                            {/* ALWAYS Show Standard Dose Regimen at the bottom */}
                                            <div className="mt-6 pt-5 border-t border-slate-200 flex flex-col items-center justify-center gap-2 animate-pop-in w-full">
                                                <span className="text-slate-500 uppercase tracking-widest text-[11px] font-black bg-slate-100 px-3 py-1 rounded-full border border-slate-200">📌 Standard Dose Regimen</span>
                                                <span className="text-lg font-black text-slate-800 bg-white px-5 py-3 rounded-xl border border-slate-200 shadow-sm w-full text-center">
                                                    {selectedDrug.stdDose}
                                                </span>
                                            </div>
                                        </div>

                                        {selectedDrug.warfarin && (
                                            <div className={`p-5 rounded-3xl border-l-[6px] shadow-md ${selectedDrug.warfarin.includes('HIGH') || selectedDrug.warfarin.includes('INCREASES') ? 'bg-rose-100 border-rose-500 text-rose-900' : 'bg-amber-100 border-amber-500 text-amber-900'}`}>
                                                <div className="flex items-start gap-4">
                                                    <div className={`p-2.5 rounded-2xl shadow-md ${selectedDrug.warfarin.includes('HIGH') ? 'bg-rose-600 text-white' : 'bg-amber-600 text-white'}`}>
                                                        <Icon name="alert-triangle" size={24} />
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-xs uppercase tracking-widest opacity-80 mb-1">Warfarin Interaction</div>
                                                        <p className="text-lg font-black leading-relaxed text-slate-900">{selectedDrug.warfarin}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="p-5 bg-emerald-50 rounded-3xl border border-emerald-300 shadow-sm">
                                                <div className="text-sm font-black text-emerald-800 flex items-center gap-2 mb-3 uppercase tracking-widest"><Icon name="shield-check" size={18} /> Coverage</div>
                                                <p className="text-base text-slate-900 leading-relaxed font-bold">{selectedDrug.cover || '-'}</p>
                                            </div>
                                            <div className="p-5 bg-rose-50 rounded-3xl border border-rose-300 shadow-sm">
                                                <div className="text-sm font-black text-rose-800 flex items-center gap-2 mb-3 uppercase tracking-widest"><Icon name="alert-circle" size={18} /> Gaps</div>
                                                <p className="text-base text-slate-900 leading-relaxed font-bold">{selectedDrug.gap || '-'}</p>
                                            </div>
                                        </div>

                                        {selectedDrug.admin && (
                                            <div className="p-6 bg-blue-50 rounded-3xl border border-blue-300 shadow-sm">
                                                <div className="text-sm font-black text-blue-800 flex items-center gap-2 mb-3 uppercase tracking-widest"><Icon name="syringe" size={18} /> Administration</div>
                                                <p className="text-base text-slate-900 leading-relaxed font-black">{selectedDrug.admin}</p>
                                            </div>
                                        )}

                                        <button onClick={() => setShowSideEffects(true)} className="w-full py-5 rounded-[2rem] text-lg font-black flex items-center justify-center gap-3 shadow-xl btn-gradient tracking-widest">
                                            <Icon name="activity" size={24} /> VIEW SIDE EFFECTS
                                        </button>
                                    </div>
                                </div>

                                {/* Drug-Specific Dosing Table */}
                                <section className="pt-6 pb-12 animate-slide-up">
                                    <div className="flex items-center gap-2 mb-4 px-4">
                                        <Icon name="table" className="text-slate-700" />
                                        <h3 className="font-black text-slate-900 uppercase tracking-[0.2em] text-sm font-heading">Dosing Reference Table</h3>
                                    </div>
                                    <div className="glass-card rounded-[2.5rem] overflow-hidden border border-slate-300 shadow-lg">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-900 text-white uppercase font-black tracking-widest">
                                                    <tr>
                                                        <th className="p-5 whitespace-nowrap">CrCl / Mode</th>
                                                        <th className="p-5">Explicit Dosage Regimen</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-300">
                                                    {selectedDrug.adjustments.map((adj, i) => (
                                                        <tr key={i} className={`transition-colors ${currentRecommendation?.label === adj.label && dialysisType === 'none' ? 'bg-pink-100' : 'hover:bg-slate-100 bg-white'}`}>
                                                            <td className="p-5 font-black text-slate-700 uppercase tracking-widest text-xs whitespace-nowrap">
                                                                {adj.label}
                                                                {currentRecommendation?.label === adj.label && dialysisType === 'none' && <span className="ml-3 text-pink-600 animate-pulse">●</span>}
                                                            </td>
                                                            <td className={`p-5 text-base ${currentRecommendation?.label === adj.label && dialysisType === 'none' ? 'text-pink-800 font-black' : 'text-slate-900 font-black'}`}>{adj.dose}</td>
                                                        </tr>
                                                    ))}
                                                    <tr className="bg-slate-100">
                                                        <td className="p-5 font-black text-slate-700 text-xs tracking-widest whitespace-nowrap">IHD (HD)</td>
                                                        <td className="p-5 font-black text-blue-900 text-base">{selectedDrug.ihd}</td>
                                                    </tr>
                                                    <tr className="bg-slate-100">
                                                        <td className="p-5 font-black text-slate-700 text-xs tracking-widest whitespace-nowrap">CAPD</td>
                                                        <td className="p-5 font-black text-orange-800 text-base">{selectedDrug.capd}</td>
                                                    </tr>
                                                    <tr className="bg-slate-100">
                                                        <td className="p-5 font-black text-slate-700 text-xs tracking-widest whitespace-nowrap">CRRT</td>
                                                        <td className="p-5 font-black text-purple-900 text-base">{selectedDrug.crrt}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </section>
                            </section>
                        )}
                    </main>

                    {/* Side Effects Modal */}
                    {showSideEffects && selectedDrug && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-xl bg-slate-900/70 animate-fade-in">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-sm overflow-hidden border border-white transform transition-all scale-100 max-h-[85vh] flex flex-col">
                                <div className="bg-gradient-to-r from-orange-400 to-pink-500 p-8 shadow-md flex justify-between items-start">
                                    <div>
                                        <h3 className="text-3xl font-black text-white font-heading tracking-tight">Side Effects</h3>
                                        <p className="text-sm text-white/90 font-bold uppercase tracking-widest mt-1">{selectedDrug.name}</p>
                                    </div>
                                    <button onClick={() => setShowSideEffects(false)} className="bg-white/20 hover:bg-white/30 p-2.5 rounded-2xl text-white transition-colors">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                <div className="p-8 space-y-6 overflow-y-auto bg-white flex-1">
                                    <div className="bg-slate-50 rounded-3xl p-6 border border-slate-200 shadow-inner">
                                        <ul className="space-y-5">
                                            {selectedDrug.sideEffects ? selectedDrug.sideEffects.split(',').map((effect, i) => (
                                                <li key={i} className="flex items-start gap-4">
                                                    <div className="w-3 h-3 rounded-full bg-pink-500 mt-1.5 flex-shrink-0 shadow-sm border-2 border-white"></div>
                                                    <span className="text-lg font-black text-slate-900 leading-tight uppercase tracking-tight">{effect.trim()}</span>
                                                </li>
                                            )) : <p className="text-slate-700 italic text-center font-bold">No adverse data found.</p>}
                                        </ul>
                                    </div>
                                    <div className="bg-amber-50 p-4 rounded-2xl border border-amber-300 text-sm font-black text-amber-900 italic text-center leading-relaxed shadow-sm">
                                        * Incidence rates may vary based on clinical condition and comorbidities.
                                    </div>
                                    <button onClick={() => setShowSideEffects(false)} className="w-full py-5 bg-slate-900 text-white font-black rounded-2xl hover:bg-slate-800 transition-colors text-lg shadow-xl tracking-widest uppercase">Close Safety Profile</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="mt-8 py-10 text-center bg-transparent">
                        <div className="flex items-center justify-center gap-3 mb-3 opacity-60">
                            <Icon name="heart" size={18} className="text-pink-600 fill-pink-600" />
                            <span className="text-slate-700 font-black tracking-widest uppercase text-xs">Quality Healthcare Support</span>
                        </div>
                        <p className="text-slate-900 text-sm font-black tracking-widest">© 2026 Created By Oatto MDCU72</p>
                        <div className="max-w-[300px] mx-auto mt-4 px-5 py-3 rounded-2xl bg-white border border-slate-300 shadow-sm">
                            <p className="text-slate-800 text-[10px] font-bold leading-relaxed italic">Information for clinical decision support. Physician judgment is required. Verify with latest official guidelines.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
